name: Open Source Readiness

on:
  pull_request:
  push:
    branches:
      - main
      - open-sourcing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-profile-config:
    name: Provider profile config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight config dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-dotenv==1.1.1
          python -m pip install SQLAlchemy==2.0.43
          python -m pip install diff-match-patch==20200713
          python -m pip install beautifulsoup4==4.12.3
          python -m pip install PyJWT==2.10.1

      - name: Verify documented provider profiles
        run: python scripts/verify_open_source_profiles.py

      - name: Smoke external JWT auth
        run: python scripts/smoke_external_jwt_auth.py

      - name: Smoke SQLAlchemy usage limits
        run: python scripts/smoke_sqlalchemy_usage_limits.py

      - name: Smoke SQLAlchemy persistence
        run: python scripts/smoke_sqlalchemy_persistence.py

      - name: Smoke SQLAlchemy email ingest
        run: python scripts/smoke_sqlalchemy_email_ingest.py

      - name: Smoke Microsoft Graph inbound
        run: python scripts/smoke_microsoft_graph_inbound.py

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-onboarding:
    name: Docker onboarding
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate published-image compose config
        env:
          ATTENLY_ENV_FILE: .env.example
        run: docker compose --env-file .env.example config

      - name: Validate source-build compose config
        env:
          ATTENLY_ENV_FILE: .env.example
        run: docker compose -f compose.yml -f compose.build.yml --env-file .env.example config

      - name: Build frontend Docker image
        run: docker build -t attenly-frontend:test frontend
