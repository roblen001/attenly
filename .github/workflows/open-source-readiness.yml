name: Open Source Readiness

on:
  pull_request:
  push:
    branches:
      - main
      - open-sourcing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-profile-config:
    name: Provider profile config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install lightweight config dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-dotenv==1.2.2
          python -m pip install SQLAlchemy==2.0.43
          python -m pip install diff-match-patch==20200713
          python -m pip install beautifulsoup4==4.12.3
          python -m pip install PyJWT==2.13.0

      - name: Verify documented provider profiles
        run: python scripts/verify_open_source_profiles.py

      - name: Preflight Docker self-hosted env
        run: python scripts/check_self_hosted_env.py .github/env/self-hosted-docker.env

      - name: Test release helper safety
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Smoke external JWT auth
        run: python scripts/smoke_external_jwt_auth.py

      - name: Smoke SQLAlchemy usage limits
        run: python scripts/smoke_sqlalchemy_usage_limits.py

      - name: Smoke SQLAlchemy persistence
        run: python scripts/smoke_sqlalchemy_persistence.py

      - name: Smoke SQLAlchemy email ingest
        run: python scripts/smoke_sqlalchemy_email_ingest.py

      - name: Smoke Microsoft Graph inbound
        run: python scripts/smoke_microsoft_graph_inbound.py

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Lint frontend
        run: npm run lint

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  docker-onboarding:
    name: Docker onboarding
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate published-image compose config
        env:
          ATTENLY_ENV_FILE: .env.example
        run: docker compose --env-file .env.example config

      - name: Validate source-build compose config
        env:
          ATTENLY_ENV_FILE: .env.example
        run: docker compose -f compose.yml -f compose.build.yml --env-file .env.example config

      - name: Build frontend Docker image
        run: docker build -t attenly-frontend:test frontend

      - name: Run source-build compose health smoke
        run: |
          docker compose \
            -p attenly-ci \
            -f compose.yml \
            -f compose.build.yml \
            --env-file .github/env/self-hosted-docker.env \
            up -d --build --wait

          curl -fsS http://localhost:5173/health
          curl -fsS http://localhost:5173/api/ready

          docker compose \
            -p attenly-ci \
            -f compose.yml \
            -f compose.build.yml \
            --env-file .github/env/self-hosted-docker.env \
            exec -T backend sh -lc 'test -w /data && test -d /data/storage'

          docker compose \
            -p attenly-ci \
            -f compose.yml \
            -f compose.build.yml \
            --env-file .github/env/self-hosted-docker.env \
            exec -T backend python -m unittest discover -s tests -v

      - name: Clean up compose smoke
        if: always()
        run: |
          docker compose \
            -p attenly-ci \
            -f compose.yml \
            -f compose.build.yml \
            --env-file .github/env/self-hosted-docker.env \
            down -v --remove-orphans
